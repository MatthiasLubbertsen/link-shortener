services:
  # One-off: creates or updates the database tables. Run before first start
  # and again after schema changes.
  migrate:
    build:
      context: .
      target: builder
    # Runs as root, so hand the data directory to the app user (node, uid 1000) afterwards.
    command: ["sh", "-c", "pnpm db:push && chown -R 1000:1000 /data"]
    environment:
      DATABASE_URL: "file:/data/app.db"
    volumes:
      - ./data:/data
    profiles: ["tools"]

  app:
    build:
      context: .
      target: runtime
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/app.db"
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env (min 32 chars)}"
      # Public origin of the shortener, used for the OAuth redirect URI.
      PUBLIC_URL: "${PUBLIC_URL:?set PUBLIC_URL, e.g. https://go.example.com}"
      # OIDC provider. Defaults to Hack Club Auth if these are left empty.
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:?set in .env}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:?set in .env}"
      OIDC_AUTHORIZE_URL: "${OIDC_AUTHORIZE_URL:-https://auth.hackclub.com/oauth/authorize}"
      OIDC_TOKEN_URL: "${OIDC_TOKEN_URL:-https://auth.hackclub.com/oauth/token}"
      OIDC_USERINFO_URL: "${OIDC_USERINFO_URL:-https://auth.hackclub.com/oauth/userinfo}"
      OIDC_SCOPE: "${OIDC_SCOPE:-openid profile email slack_id verification_status}"
      # Set to false for providers that don't send verification_status (e.g. Tinyauth).
      OIDC_REQUIRE_VERIFIED: "${OIDC_REQUIRE_VERIFIED:-true}"
      # Comma-separated emails allowed to sign in. Leave empty to allow anyone the provider accepts.
      OIDC_ALLOWED_EMAILS: "${OIDC_ALLOWED_EMAILS:-}"
      # Optional Liwan analytics: every redirect is also sent to Liwan.
      # Leave LIWAN_ENTITY_ID empty to turn this off. LIWAN_URL must be
      # reachable from this container (the bundled "liwan" service below, or
      # your own instance).
      LIWAN_URL: "${LIWAN_URL:-http://liwan:9042}"
      LIWAN_ENTITY_ID: "${LIWAN_ENTITY_ID:-}"
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Optional bundled Liwan (https://liwan.dev), only started with
  # `docker compose --profile liwan up -d`. Skip it if you already run Liwan
  # and point LIWAN_URL at that instead. After first start, run
  # `docker compose logs liwan` for the one-time setup link, create an entity,
  # and put its id in LIWAN_ENTITY_ID.
  liwan:
    profiles: ["liwan"]
    image: ghcr.io/explodingcamera/liwan:1.8
    # Public URL of the Liwan dashboard.
    environment:
      LIWAN_BASE_URL: "${LIWAN_BASE_URL:-http://localhost:9042}"
      # The app forwards each visitor's IP in X-Forwarded-For. Only the app
      # (and your reverse proxy) can reach this container, so trust it.
      LIWAN_TRUSTED_PROXIES: "*"
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - liwan-data:/data
    restart: unless-stopped

volumes:
  liwan-data:
