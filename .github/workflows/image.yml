name: Build image

on:
  push:
    branches: [main, tinyauth-support]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR requires lowercase image names
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runtime image: what the app container runs
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Builder image: the migrate step needs drizzle-kit, which the runtime image doesn't include
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: true
          tags: ${{ env.IMAGE }}:builder
          cache-from: type=gha
          cache-to: type=gha,mode=max